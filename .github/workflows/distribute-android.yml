name: Distribute Android beta

# Two trigger paths:
#   1. Manual via the Actions UI ("Run workflow"). Pick env + optional notes.
#   2. Tag push matching v*  (e.g. `git tag v0.1.0+4 && git push --tags`).
#      The tag form gives you a permanent git record of every shipped build.
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Build environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      notes:
        description: 'Release notes (optional; defaults to last commit subject)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

# Allow only one beta build to run at a time. A second push while one is mid-
# flight will queue rather than running concurrently (avoids race conditions on
# Gradle caches + Firebase release-slot ordering).
concurrency:
  group: distribute-android
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    # Cold first build (NDK + CMake install, ~60 pub deps + Gradle cold
    # dep resolution + Kotlin/Java compile, no warm caches yet) measured
    # at ~30 min and still going when the prior 30-min timeout fired.
    # Warm runs after caches populate should finish in ~10–15 min — but
    # 60 min keeps headroom for an unlucky cold rebuild later.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (pinned to .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter_app/android/**/*.gradle*', 'apps/flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      # Decode keystore from a base64 secret and export the path so
      # build.gradle.kts picks it up (mirrors local dev setup, just sourced
      # from GH secrets instead of ~/keystores/).
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          KEYSTORE_PATH="$HOME/keystores/gameplatform-upload.keystore"
          mkdir -p "$HOME/keystores"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # Firebase auth via a CI token (FIREBASE_TOKEN env var). Used instead
      # of a service-account JSON because the GCP org policy here blocks
      # long-lived SA key creation (iam.disableServiceAccountKeyCreation).
      # Generate the token locally with `firebase login:ci`. Future upgrade
      # path: Workload Identity Federation — see android-ci-secrets memory.
      - name: Verify Firebase token present
        env:
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FB_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is empty"
            exit 1
          fi

      - name: Resolve env + release notes
        id: resolve
        env:
          INPUT_ENV: ${{ inputs.env }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          # Manual dispatch supplies inputs; tag push doesn't.
          ENV_NAME="${INPUT_ENV:-staging}"
          if [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="$INPUT_NOTES"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NOTES="${GITHUB_REF_NAME}: $(git log -1 --pretty=%s)"
          else
            NOTES="$(git log -1 --pretty=%s)"
          fi
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Pub get
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Build + distribute
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          bash scripts/distribute-android.sh \
            "${{ steps.resolve.outputs.env }}" \
            "${{ steps.resolve.outputs.notes }}"

      # Upload the APK as a build artifact so it's downloadable from the
      # Actions run page even if Firebase distribution flakes.
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.resolve.outputs.env }}
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
