name: UI Tests (macOS, recorded)

# Runs the Flutter integration_test suite on a dedicated iOS simulator on the
# self-hosted macOS runner, records the simulator screen for human review,
# uploads the .mov as a PR artifact, and posts a sticky comment with a link.
#
# Triggered only when a PR carries the `needs-ui-tests` label. Author adds the
# label when they want a video; runs again on each new push as long as the
# label is still there.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # New pushes to the same PR cancel in-progress UI runs — a single mac can
  # only run one at a time, and stale screen recordings aren't worth keeping.
  group: ui-tests-mac-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui-tests:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'needs-ui-tests') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Matches the labels configured during runner registration. `ui-runner`
    # pins this job to the dedicated macOS host; if no runner with these
    # labels is online the job stays queued instead of falling back to
    # GitHub-hosted (which can't drive an iOS simulator).
    runs-on: [self-hosted, macOS, ui-runner]
    timeout-minutes: 30

    # Needed for the sticky comment step. Default GITHUB_TOKEN permissions
    # at the repo level can be `contents: read` only, which 403s on PR
    # comment writes ("Resource not accessible by integration").
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          /opt/homebrew/bin/fvm --version
          /opt/homebrew/bin/fvm flutter --version | head -3

      - name: Refresh CocoaPods (fresh clone has no ios/Pods cache)
        # Regenerate Podfile.lock from scratch so plugin pubspec bumps that
        # require newer pod versions (e.g. flutter_webrtc 1.4.0 → WebRTC-SDK
        # 144.x) don't fight a stale lock committed from a dev mac with the
        # old version cached. CI doesn't commit the lock back, so the
        # transient regenerated lock is throwaway. `--repo-update` ensures
        # we resolve against the freshest spec repo.
        working-directory: apps/flutter_app
        run: |
          /opt/homebrew/bin/fvm flutter pub get
          cd ios
          rm -f Podfile.lock
          pod install --repo-update

      - name: Pre-flight — build iOS app for simulator
        # Runs BEFORE `flutter test` to surface native build errors clearly
        # (missing arm64-simulator slices, plugin compile failures). The
        # destination-not-found error from `flutter test` is opaque; this
        # step's xcodebuild output names the actual missing symbol/arch.
        # `continue-on-error: true` so we still get test output downstream
        # even if this fails — it's diagnostic, not a hard gate.
        continue-on-error: true
        working-directory: apps/flutter_app
        run: |
          mkdir -p ${{ github.workspace }}/ui-run-artifacts
          /opt/homebrew/bin/fvm flutter build ios --simulator --debug \
            --no-codesign --no-pub --no-version-check 2>&1 \
            | tee ${{ github.workspace }}/ui-run-artifacts/preflight-build.log \
            || true

      - name: Run UI tests with screen recording
        env:
          # Matches the dedicated simulator created at runner setup time.
          SIM_NAME: CI-iPhone-17
          FLUTTER: /opt/homebrew/bin/fvm flutter
          OUT_DIR: ${{ github.workspace }}/ui-run-artifacts
          # Record the all-players-pass redeal scenario (issue #44). The
          # redeal test is gated behind TN_FORCE_BOT_PASS so bots pass
          # deterministically; --plain-name keeps the recording focused on
          # just that test (the file also holds the full game-flow test).
          TEST_TARGET: integration_test/game_twenty_nine_test.dart
          # The runner IS the dev mac, where local Supabase is running, so the
          # simulator reaches it at 127.0.0.1:54321 (the app needs a backend for
          # guest login + create-room + add-bot + start-game). Single-word
          # --plain-name value: FLUTTER_EXTRA_ARGS is expanded unquoted by the
          # CI script, so a quoted multi-word value would word-split into broken
          # tokens. "redeal" uniquely matches the 'all-pass redeal: …' test.
          FLUTTER_EXTRA_ARGS: --dart-define=TN_FORCE_BOT_PASS=true --dart-define=ENV=development --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --plain-name redeal
        run: |
          mkdir -p ${{ github.workspace }}/ui-run-artifacts
          bash ./scripts/ci/run-ui-tests-mac.sh

      - name: Upload recording to Supabase Storage (durable public link)
        if: always()
        env:
          SUPABASE_STORAGE_SERVICE_KEY: ${{ secrets.SUPABASE_STORAGE_SERVICE_KEY }}
          SUPABASE_STORAGE_PROJECT_REF: ${{ secrets.SUPABASE_STORAGE_PROJECT_REF }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          OUT_DIR: ${{ github.workspace }}/ui-run-artifacts
        run: bash ./scripts/ci/upload-ui-video.sh

      - name: Upload run artifacts (video + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-run-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ui-run-artifacts/
          # Short-term archive; the durable copy is in Supabase Storage above.
          retention-days: 90

      - name: Post sticky PR comment with artifact link
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ui-tests-mac
          message: |
            ### 📹 UI test run (macOS)

            - Status: **${{ job.status }}**
            - 📺 Video (durable, public): ${{ env.VIDEO_URL || '_upload skipped — see artifact_' }}
            - Workflow run: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Artifact (90-day): `ui-run-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}` — `run.mov`, `test.log`, `summary.txt`

            The video link is a direct file (plays in-browser), kept as the latest per PR in Supabase Storage; older runs are swept after 30 days. Re-trigger by re-adding the `needs-ui-tests` label or pushing a commit.
