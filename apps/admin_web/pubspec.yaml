name: admin_web
description: Gathr Admin — operator console for tournaments, economy, seasons & promotions.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Backend — standalone client (no native deps, web-safe)
  supabase_flutter: ^2.5.6

  # Fonts (matches the consumer app's Refined Crystal system)
  google_fonts: ^6.3.2

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
