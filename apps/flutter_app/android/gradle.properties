# Sized for the GitHub-hosted Linux runner (7 GB RAM total). The previous
# -Xmx8G request couldn't fit, so the kernel OOM-killer SIGTERM'd Gradle
# ~20 min into release builds. 5 GB leaves ~2 GB headroom for AGP's CMake
# invocation + kernel + cache. Local builds on a 16 GB+ Mac fit fine here too.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Disable Gradle's file-system watcher in CI — it tripped the inotify watch
# limit on the runner and added a deadlock signal right before the OOM.
org.gradle.vfs.watch=false
android.useAndroidX=true
