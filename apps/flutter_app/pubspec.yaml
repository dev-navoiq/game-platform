name: flutter_app
description: Multiplayer Game Platform
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6
  rxdart: ^0.28.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5

  # Fonts
  google_fonts: ^8.1.0

  # UI
  flutter_animate: ^4.5.0
  rive: ^0.13.4
  lottie: ^3.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Glass UI
  glassmorphism: ^3.0.0
  blur: ^3.1.0

  # Audio
  audioplayers: ^6.0.0

  # Voice Chat
  livekit_client: ^2.1.0
  permission_handler: ^11.3.0

  # OTA Updates
  shorebird_code_push: ^1.1.0

  # Monetization
  purchases_flutter: ^8.0.0  # RevenueCat
  google_mobile_ads: ^5.0.0

  # Analytics & Monitoring
  sentry_flutter: ^9.20.0
  # posthog_flutter: temporarily removed — 5.x has a build-time bug
  # (Unresolved reference 'postHogVersion' in PosthogFlutterPlugin.kt)
  # on Android Gradle Plugin 8+ that prevents release builds.
  # Re-add once upstream ships a fix.

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0

  # Local packages
  game_core:
    path: ../../packages/game_core
  game_twenty_nine:
    path: ../../packages/game_twenty_nine
  game_oh_hell:
    path: ../../packages/game_oh_hell
  game_hearts:
    path: ../../packages/game_hearts
  game_spades:
    path: ../../packages/game_spades
  game_bridge:
    path: ../../packages/game_bridge
  game_rummy:
    path: ../../packages/game_rummy
  game_chess:
    path: ../../packages/game_chess
  game_ludo:
    path: ../../packages/game_ludo
  game_sequence:
    path: ../../packages/game_sequence
  bot_strategies:
    path: ../../packages/bot_strategies
  social_core:
    path: ../../packages/social_core
  monetization:
    path: ../../packages/monetization

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  go_router_builder: ^2.4.1
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter
  # Testing extras
  golden_toolkit: ^0.15.0
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/cards/
    - assets/boards/
    - assets/rooms/
    - assets/audio/
    - assets/animations/
    - assets/icons/
    - assets/shared/
