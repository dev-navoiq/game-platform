name: monetization
description: IAP, subscriptions (Free/Pro $3.99/Max $7.99), coin economy, ads, season pass.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  game_core:
    path: ../game_core
  # ^5.x matches the constraint already declared in apps/flutter_app and
  # avoids the newer native-SDK (AGP/compileSdk/iOS-min) requirements of 6+.
  google_mobile_ads: ^5.3.1
  meta: ^1.11.0

dev_dependencies:
  mocktail: ^1.0.3
  test: ^1.25.0
