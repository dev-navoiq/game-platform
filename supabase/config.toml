# A string used to distinguish different Supabase projects on the same host.
project_id = "game-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# gathr://login-callback/ is the app deep link OAuth + password-recovery
# emails return to (see AuthService.oauthRedirectUri). Mirror it in the
# staging/prod dashboard (Auth → URL Configuration) when enabling providers.
additional_redirect_urls = ["https://127.0.0.1:3000", "gathr://login-callback/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

# notify-dispatch is a database-webhook target (pg_net trigger), not a
# client-called function — it authenticates with x-webhook-secret instead
# of a user JWT.
[functions.notify-dispatch]
verify_jwt = false

# Payment functions. Webhooks (stripe-webhook, verify-subscription) carry the
# provider's own secret, not a Supabase JWT. The client-called verify/checkout
# functions authenticate the user in code via requireAuth() — the gateway
# check is off because the new ES256 publishable-key JWTs fail it.
[functions.stripe-webhook]
verify_jwt = false
[functions.verify-subscription]
verify_jwt = false
[functions.create-stripe-checkout]
verify_jwt = false
[functions.verify-web-purchase]
verify_jwt = false
[functions.verify-native-purchase]
verify_jwt = false
